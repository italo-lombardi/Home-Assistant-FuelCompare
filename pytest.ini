[pytest]
testpaths = tests
# Enforce full coverage: every line and branch of the integration must be
# exercised by the suite. --cov-fail-under=100 fails the run below 100%.
addopts = --cov=custom_components/fuelcompare_ie --cov-branch --cov-report=term-missing --cov-fail-under=100
# asyncio_mode = auto: all async test functions run under pytest-asyncio without
# needing @pytest.mark.asyncio decorators. Strict mode would require them explicitly.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    smoke: live-network smoke tests against real upstream APIs; skipped unless FUELCOMPARE_RUN_SMOKE=1
